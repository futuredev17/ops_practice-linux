events {}

http {
    upstream backend_servers {
        # Define two backend servers here
        # max_fails=1
        # fail_timeout=10s
        server YOUR_VM_IP:8082 max_fails=1 fail_timeout=10s;
        server YOUR_VM_IP:8083 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            # Forward requests to the backend cluster
            proxy_pass http://backend_servers;
        }
    }
}
